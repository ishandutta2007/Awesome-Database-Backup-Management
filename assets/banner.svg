<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .orbit-line {
        stroke: #334155;
        stroke-dasharray: 6 6;
        animation: rotate 20s linear infinite;
        transform-origin: 980px 160px;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.8; }
        100% { transform: scale(1); opacity: 0.4; }
      }
      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic / Animated Background Graphics (Right & Ambient side, behind text) -->
  <g opacity="0.6">
    <circle cx="980" cy="160" r="120" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="980" cy="160" r="90" class="orbit-line" fill="none" />
    
    <!-- Pulsing Data Hub Rings -->
    <circle cx="980" cy="160" r="60" fill="#38bdf8" opacity="0.15" class="pulse-circle" style="transform-origin: 980px 160px;" />
    <circle cx="980" cy="160" r="35" fill="url(#accentGrad)" opacity="0.8" filter="url(#glow)" />
    
    <!-- Connecting Data Nodes -->
    <path d="M 750 80 Q 880 120 980 160 T 1120 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-dasharray="8 4"/>
    <path d="M 780 250 Q 890 200 980 160 T 1100 70" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
    
    <!-- Floating Tech Elements -->
    <circle cx="840" cy="110" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1060" cy="210" r="5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="910" cy="230" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1030" cy="90" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="10" height="320" rx="5" fill="url(#accentGrad)" />

  <!-- Foreground Content (Guaranteed crisp visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag / Pill -->
    <g transform="translate(0, 55)">
      <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="20" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="35" y="21" class="badge-text">DATABASE PROTECTION 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title">Awesome Database Backup</text>
    <text x="0" y="192" class="title" fill="url(#accentGrad)">&amp; Recovery Ecosystem 🗄️⚡</text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle">Curated SaaS Platforms, Enterprise Solutions &amp; Open-Source DR Tools</text>

    <!-- Feature Highlights / Mini Chips -->
    <g transform="translate(0, 265)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" font-weight="600">
        🛡️ Ransomware Protection  •  ⏱️ Point-in-Time Recovery (PITR)  •  📦 Multi-Cloud &amp; Hot Backups
      </text>
    </g>
  </g>
</svg>
